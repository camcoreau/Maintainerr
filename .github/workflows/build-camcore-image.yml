name: Build CamCore Maintainerr image

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/maintainerr

jobs:
  build:
    name: Build and publish CamCore image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply official CamCore artwork
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/camcoreau/Seerr/develop/public/logo_full.svg" \
            -o /tmp/camcore-logo.svg

          cp /tmp/camcore-logo.svg apps/ui/public/logo_black.svg

          for target in apps/ui/public/logo.svg apps/ui/public/logo_white.svg; do
            if [ -f "$target" ]; then
              cp /tmp/camcore-logo.svg "$target"
            fi
          done

          curl -fsSL \
            "https://raw.githubusercontent.com/camcoreau/Seerr/develop/public/os_icon.svg" \
            -o apps/ui/public/camcore-icon.svg

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION_TAG=latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
